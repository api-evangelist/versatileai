name: versatile.ai
description: >-
  Versatile is a construction-technology company building AI-powered crane
  intelligence for jobsites, primarily serving steel erectors and general
  contractors. Its CraneView hardware device attaches to a crane's hook block
  and passively captures operational data, which the Control Center software
  turns into real-time insight on pace, progress, productivity, and delays
  without asking crews to change how they work. The company is backed by Insight
  Partners. As of this profile Versatile publishes no public API, SDK, or
  developer platform; this record captures its identity, published web
  properties, and probed domain-security posture.
